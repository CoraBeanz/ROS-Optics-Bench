  <text transform="translate(754 415.0) rotate(-90)" text-anchor="middle" class="mono">150 mm</text>

  <text x="64" y="584" text-anchor="start" class="lt">635 nm laser</text><text x="64" y="606" text-anchor="start" class="spec">Quarton VLM-635-32 LPT</text><text x="64" y="625" text-anchor="start" class="ls">Under 1 mW,</text><text x="64" y="644" text-anchor="start" class="ls">beam about 7 × 3 mm.</text><text x="359" y="584" text-anchor="middle" class="lt">Crossed polarizers</text><text x="359" y="606" text-anchor="middle" class="spec">linear polarizer sheet</text><text x="359" y="625" text-anchor="middle" class="ls">The brightness knob:</text><text x="359" y="644" text-anchor="middle" class="ls">rotate the first one.</text><text x="560" y="584" text-anchor="middle" class="lt">Beamsplitter</text><text x="560" y="606" text-anchor="middle" class="spec">plate or cube</text><text x="560" y="625" text-anchor="middle" class="ls">Sends a slice to the</text><text x="560" y="644" text-anchor="middle" class="ls">reference photodiode.</text><line x1="359" y1="560" x2="359" y2="564" stroke="#3b4a7a" stroke-width="1.2"/><line x1="560" y1="550" x2="560" y2="564" stroke="#3b4a7a" stroke-width="1.2"/><line x1="122" y1="554" x2="122" y2="564" stroke="#3b4a7a" stroke-width="1.2"/><text x="64" y="392" text-anchor="start" class="lt">2 mm aperture</text><text x="64" y="414" text-anchor="start" class="spec">printed, 10-20 mm after the laser</text><text x="64" y="433" text-anchor="start" class="ls">Trims the beam to the fiber mode. In the</text><text x="64" y="452" text-anchor="start" class="ls">twin 83% of what passes it couples, against</text><text x="64" y="471" text-anchor="start" class="ls">25% of the whole beam without it.</text><line x1="220" y1="484" x2="220" y2="500" stroke="#3b4a7a" stroke-width="1.2"/><text x="560" y="356" text-anchor="middle" class="lt">Reference photodiode</text><text x="560" y="378" text-anchor="middle" class="spec">BPW34, MCP6002 amp, 47 kΩ</text><text x="560" y="397" text-anchor="middle" class="ls">Read on ADS1115 A0.</text><line x1="560" y1="408" x2="560" y2="431" stroke="#3b4a7a" stroke-width="1.2"/><text x="590" y="186" text-anchor="end" class="lt">M1 and M2</text><text x="590" y="208" text-anchor="end" class="spec">1 in mirrors, Thorlabs KMS-style mounts</text><text x="590" y="227" text-anchor="end" class="ls">Each 100 TPI adjuster is turned</text><text x="590" y="246" text-anchor="end" class="ls">by its own NEMA 8: four axes.</text><text x="722" y="336" class="mname">M2</text><text x="678" y="512" text-anchor="end" class="mname">M1</text><line x1="733.59" y1="528.94" x2="806" y2="491" stroke="#3b4a7a" stroke-width="1.1"/><circle cx="733.59" cy="528.94" r="2" fill="#e6e9f2"/><text x="812" y="496" class="small">100 TPI adjuster</text><line x1="739.81" y1="538.27" x2="806" y2="513" stroke="#3b4a7a" stroke-width="1.1"/><circle cx="739.81" cy="538.27" r="2" fill="#e6e9f2"/><text x="812" y="518" class="small">2 mm hex rod</text><line x1="750.2" y1="542.02" x2="806" y2="535" stroke="#3b4a7a" stroke-width="1.1"/><circle cx="750.2" cy="542.02" r="2" fill="#e6e9f2"/><text x="812" y="540" class="small">brass coupler</text><line x1="775.66" y1="553.33" x2="806" y2="557" stroke="#3b4a7a" stroke-width="1.1"/><circle cx="775.66" cy="553.33" r="2" fill="#e6e9f2"/><text x="812" y="562" class="small">NEMA 8 motor</text><text x="875" y="186" text-anchor="middle" class="lt">Iris 1 and iris 2</text><text x="875" y="208" text-anchor="middle" class="spec">printed</text><text x="875" y="227" text-anchor="middle" class="ls">Mark the beam axis in phase 1. For the fiber,</text><text x="875" y="246" text-anchor="middle" class="ls">iris 1 comes out and iris 2 is a 3 mm baffle.</text><line x1="775" y1="251" x2="775" y2="268" stroke="#3b4a7a" stroke-width="1.2"/><line x1="975" y1="251" x2="975" y2="268" stroke="#3b4a7a" stroke-width="1.2"/><text x="1040" y="368" text-anchor="middle" class="lt">f = 8 mm asphere</text><text x="1040" y="390" text-anchor="middle" class="spec">on a micrometer stage</text><text x="1040" y="409" text-anchor="middle" class="ls">The stage moves it to focus.</text><text x="1040" y="428" text-anchor="middle" class="ls">In phase 1 the OV9281 takes its place.</text><line x1="1040" y1="333" x2="1040" y2="348" stroke="#3b4a7a" stroke-width="1.2"/><text x="1091" y="186" text-anchor="start" class="lt">FC bulkhead</text><text x="1091" y="208" text-anchor="start" class="spec">fixed</text><text x="1091" y="227" text-anchor="start" class="ls">The lens moves,</text><text x="1091" y="246" text-anchor="start" class="ls">the fiber does not.</text><line x1="1091" y1="251" x2="1091" y2="271" stroke="#3b4a7a" stroke-width="1.2"/><text x="1232" y="536" text-anchor="end" class="lt">Output photodiode</text><text x="1232" y="558" text-anchor="end" class="spec">a second BPW34 board, ADS1115 A1</text><text x="1232" y="577" text-anchor="end" class="ls">Score = output / reference:</text><text x="1232" y="596" text-anchor="end" class="ls">the ratio cancels laser flicker.</text>
  <text x="48" y="704" class="spec">Light path, design distances in mm</text><line x1="64" y1="742" x2="1010" y2="742" stroke="url(#pathGrad)" stroke-width="3" stroke-linecap="round"/><circle cx="64" cy="742" r="5.5" fill="#0b1020" stroke="#e6e9f2" stroke-width="1.8"/><text x="64" y="768" text-anchor="middle" class="ls">laser</text><text x="131.57" y="732" text-anchor="middle" class="mono">15</text><circle cx="199.14" cy="742" r="5.5" fill="#0b1020" stroke="#e6e9f2" stroke-width="1.8"/><text x="199.14" y="768" text-anchor="middle" class="ls">aperture</text><text x="266.71" y="732" text-anchor="middle" class="mono">115</text><circle cx="334.29" cy="742" r="5.5" fill="#0b1020" stroke="#e6e9f2" stroke-width="1.8"/><text x="334.29" y="768" text-anchor="middle" class="ls">M1</text><text x="401.86" y="732" text-anchor="middle" class="mono">150</text><circle cx="469.43" cy="742" r="5.5" fill="#0b1020" stroke="#e6e9f2" stroke-width="1.8"/><text x="469.43" y="768" text-anchor="middle" class="ls">M2</text><text x="537" y="732" text-anchor="middle" class="mono">70</text><circle cx="604.57" cy="742" r="5.5" fill="#0b1020" stroke="#e6e9f2" stroke-width="1.8"/><text x="604.57" y="768" text-anchor="middle" class="ls">iris 1</text><text x="672.14" y="732" text-anchor="middle" class="mono">190</text><circle cx="739.71" cy="742" r="5.5" fill="#0b1020" stroke="#e6e9f2" stroke-width="1.8"/><text x="739.71" y="768" text-anchor="middle" class="ls">iris 2</text><text x="807.29" y="732" text-anchor="middle" class="mono">50</text><circle cx="874.86" cy="742" r="5.5" fill="#0b1020" stroke="#e6e9f2" stroke-width="1.8"/><text x="874.86" y="768" text-anchor="middle" class="ls">lens</text><text x="942.43" y="732" text-anchor="middle" class="mono">8</text><circle cx="1010" cy="742" r="5.5" fill="#0b1020" stroke="#e6e9f2" stroke-width="1.8"/><text x="1010" y="768" text-anchor="middle" class="ls">fiber</text><text x="1046" y="736" class="spec">≈ 600 mm</text><text x="1046" y="755" class="ls">laser to fiber</text>
</svg>
